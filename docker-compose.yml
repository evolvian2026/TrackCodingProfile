# Full stack: PostgreSQL, Redis, the API, a background worker and the SPA.
#
#   cp .env.example .env      # then set JWT_SECRET and POSTGRES_PASSWORD
#   docker compose up --build
#
# That is the whole sequence. The `migrate` service applies the schema before
# the API or worker start, so there is no manual step and no window in which
# the app is serving a database that has no tables.
#
# To load the 24 sample students as well:
#   docker compose run --rm migrate npm run db:seed:prod --workspace=backend
#
# The app is then on http://localhost:8080

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tcp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tcp}
      POSTGRES_DB: ${POSTGRES_DB:-tcp}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-tcp} -d ${POSTGRES_DB:-tcp}']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  # Applies the schema once and exits. Having a service own this means the API
  # and the worker cannot race each other to migrate, and a failed migration
  # stops the stack instead of leaving the app to serve an empty database.
  migrate:
    image: tcp-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ['npm', 'run', 'db:migrate', '--workspace=backend']
    working_dir: /app
    restart: 'no'
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-tcp}:${POSTGRES_PASSWORD:-tcp}@postgres:5432/${POSTGRES_DB:-tcp}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      DATA_SOURCE: ${DATA_SOURCE:-mock}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@tracker.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin@12345}
      LOG_LEVEL: ${LOG_LEVEL:-info}

  api:
    image: tcp-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-tcp}:${POSTGRES_PASSWORD:-tcp}@postgres:5432/${POSTGRES_DB:-tcp}?schema=public
      REDIS_URL: redis://redis:6379
      QUEUE_DRIVER: redis
      # The dedicated worker service drains the queue instead.
      RUN_WORKER_IN_API: 'false'
      DATA_SOURCE: ${DATA_SOURCE:-mock}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      # Deliberately NOT ${CORS_ORIGIN}: .env sets that to Vite's dev port for
      # local work, and `:-` would not override it. In Docker the browser is on
      # WEB_ORIGIN, so a stale 5173 here rejects every request the SPA makes.
      CORS_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      APP_BASE_URL: ${WEB_ORIGIN:-http://localhost:8080}
      TRUST_PROXY: 'true'
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@tracker.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin@12345}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - uploads:/app/backend/uploads
    ports:
      - '${API_PORT:-4000}:4000'

  worker:
    image: tcp-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: ['node', 'dist/src/worker.js']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-tcp}:${POSTGRES_PASSWORD:-tcp}@postgres:5432/${POSTGRES_DB:-tcp}?schema=public
      REDIS_URL: redis://redis:6379
      QUEUE_DRIVER: redis
      DATA_SOURCE: ${DATA_SOURCE:-mock}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      QUEUE_CONCURRENCY: ${QUEUE_CONCURRENCY:-4}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - uploads:/app/backend/uploads

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      # Healthy, not merely started: nginx resolves the api hostname when it
      # loads its config, so starting first turns a slow API into a dead proxy.
      api: { condition: service_healthy }
    ports:
      - '${WEB_PORT:-8080}:80'

volumes:
  postgres-data:
  redis-data:
  uploads:
